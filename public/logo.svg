<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Nunito', 'Fredoka', 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 88px;
        fill: #ffffff;
      }
    </style>
  </defs>
  
  <!-- Text ScriptsGR -->
  <text x="10" y="105" class="logo-text" letter-spacing="-1px">
    Scripts<tspan fill="#ffffff">GR</tspan>
  </text>
  
  <!-- Red underline specifically beneath the "GR" -->
  <!-- Starts below G and ends past R with rounded caps and a gentle angle -->
